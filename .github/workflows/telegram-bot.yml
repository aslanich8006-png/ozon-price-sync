name: Telegram bot (commands)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll Telegram and handle commands
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_bot.py

      - name: Commit price changes made via Telegram (if any)
        run: |
          git config user.name "ozon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/prices.csv
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Update price via Telegram command"
            git push
          fi
