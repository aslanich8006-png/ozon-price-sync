name: Telegram bot (commands)

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Текст сообщения из Telegram"
        required: false
        default: ""
      chat_id:
        description: "Chat ID отправителя"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Handle Telegram command
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TEXT: ${{ github.event.inputs.text }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: python scripts/telegram_bot.py

      - name: Commit price changes made via Telegram (if any)
        run: |
          git config user.name "ozon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/prices.csv
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Update price via Telegram command"
            git push
          fi
